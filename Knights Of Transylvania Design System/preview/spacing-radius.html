<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radius</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row4 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box {
    width: 90px; height: 70px;
    background: white;
    border: 2px solid var(--kot-cyan);
  }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-weight: 700; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="card">
    <div class="row4">
      <div class="item"><div class="box" style="border-radius:4px;"></div><div class="name">xs</div><div class="px">4px</div></div>
      <div class="item"><div class="box" style="border-radius:8px;"></div><div class="name">sm</div><div class="px">8px</div></div>
      <div class="item"><div class="box" style="border-radius:12px;"></div><div class="name">md</div><div class="px">12px</div></div>
      <div class="item"><div class="box" style="border-radius:16px;"></div><div class="name">lg</div><div class="px">16px</div></div>
      <div class="item"><div class="box" style="border-radius:24px;"></div><div class="name">xl</div><div class="px">24px</div></div>
      <div class="item"><div class="box" style="border-radius:999px;"></div><div class="name">pill</div><div class="px">999px</div></div>
    </div>
  </div>
</body>
</html>
