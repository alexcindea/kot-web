<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 80px 1fr 90px; gap: 12px; align-items: center; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-weight: 700; }
  .bar { height: 14px; background: var(--kot-cyan); border-radius: 3px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-align: right; }
</style>
</head>
<body>
  <div class="card">
    <div class="stack">
      <div class="row3"><span class="name">--space-1</span><div class="bar" style="width:4px;"></div><span class="px">4 px</span></div>
      <div class="row3"><span class="name">--space-2</span><div class="bar" style="width:8px;"></div><span class="px">8 px</span></div>
      <div class="row3"><span class="name">--space-3</span><div class="bar" style="width:12px;"></div><span class="px">12 px</span></div>
      <div class="row3"><span class="name">--space-4</span><div class="bar" style="width:16px;"></div><span class="px">16 px</span></div>
      <div class="row3"><span class="name">--space-5</span><div class="bar" style="width:24px;"></div><span class="px">24 px</span></div>
      <div class="row3"><span class="name">--space-6</span><div class="bar" style="width:32px;"></div><span class="px">32 px</span></div>
      <div class="row3"><span class="name">--space-7</span><div class="bar" style="width:48px;"></div><span class="px">48 px</span></div>
      <div class="row3"><span class="name">--space-8</span><div class="bar" style="width:64px;"></div><span class="px">64 px</span></div>
      <div class="row3"><span class="name">--space-9</span><div class="bar" style="width:96px;"></div><span class="px">96 px</span></div>
      <div class="row3"><span class="name">--space-10</span><div class="bar" style="width:128px;"></div><span class="px">128 px</span></div>
    </div>
  </div>
</body>
</html>
