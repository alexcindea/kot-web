<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #f7f8fa; }
  .card { background: transparent; padding: 32px 24px; }
  .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .box {
    width: 100px; height: 70px;
    background: white;
    border-radius: 12px;
  }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-weight: 700; }
  .desc { font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="row5">
      <div class="item">
        <div class="box" style="box-shadow: 0 1px 2px rgba(12,12,12,0.06), 0 1px 3px rgba(12,12,12,0.08);"></div>
        <div class="name">sm</div>
        <div class="desc">at-rest UI</div>
      </div>
      <div class="item">
        <div class="box" style="box-shadow: 0 8px 24px -8px rgba(12,12,12,0.18);"></div>
        <div class="name">md</div>
        <div class="desc">cards</div>
      </div>
      <div class="item">
        <div class="box" style="box-shadow: 0 24px 60px -12px rgba(12,12,12,0.28);"></div>
        <div class="name">lg</div>
        <div class="desc">modals, hero</div>
      </div>
      <div class="item">
        <div class="box" style="box-shadow: 0 0 0 4px rgba(27,175,226,0.30);"></div>
        <div class="name">glow-cyan</div>
        <div class="desc">primary hover</div>
      </div>
      <div class="item">
        <div class="box" style="box-shadow: 0 0 0 4px rgba(247,147,53,0.32);"></div>
        <div class="name">glow-orange</div>
        <div class="desc">accent hover</div>
      </div>
    </div>
  </div>
</body>
</html>
