<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .item svg { width: 24px; height: 24px; stroke: var(--fg); stroke-width: 2; }
  .name {
    font-family: var(--font-mono);
    font-size: 9px; color: var(--fg-3);
  }
  .label-row { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="card">
    <div class="stack">
      <div class="label-row">UI Icons · Lucide · 24px / 2px stroke</div>
      <div class="grid">
        <div class="item"><i data-lucide="menu"></i><span class="name">menu</span></div>
        <div class="item"><i data-lucide="x"></i><span class="name">x</span></div>
        <div class="item"><i data-lucide="chevron-right"></i><span class="name">chevron</span></div>
        <div class="item"><i data-lucide="mail"></i><span class="name">mail</span></div>
        <div class="item"><i data-lucide="phone"></i><span class="name">phone</span></div>
        <div class="item"><i data-lucide="map-pin"></i><span class="name">map-pin</span></div>
        <div class="item"><i data-lucide="calendar"></i><span class="name">calendar</span></div>
        <div class="item"><i data-lucide="users"></i><span class="name">users</span></div>
        <div class="item"><i data-lucide="trophy"></i><span class="name">trophy</span></div>
        <div class="item"><i data-lucide="heart"></i><span class="name">heart</span></div>
        <div class="item"><i data-lucide="instagram"></i><span class="name">instagram</span></div>
        <div class="item"><i data-lucide="facebook"></i><span class="name">facebook</span></div>
        <div class="item"><i data-lucide="youtube"></i><span class="name">youtube</span></div>
        <div class="item"><i data-lucide="play"></i><span class="name">play</span></div>
        <div class="item"><i data-lucide="arrow-right"></i><span class="name">arrow</span></div>
        <div class="item"><i data-lucide="megaphone"></i><span class="name">megaphone</span></div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
