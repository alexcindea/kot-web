<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; height: 230px; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
  .cell.white  { background: #ffffff; border-right: 1px solid var(--border); }
  .cell.black  { background: #0c0c0c; border-right: 1px solid #1a1a1a; }
  .cell.cyan   { background: var(--kot-cyan); }
  .cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tag {
    position: absolute; top: 12px; left: 12px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    color: rgba(0,0,0,0.55);
  }
  .black .tag, .cyan .tag { color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="card">
    <div class="grid">
      <div class="cell white">
        <span class="tag">On white</span>
        <img src="../assets/logo-kot-shield-transparent.png" alt="KOT shield">
      </div>
      <div class="cell black">
        <span class="tag">On black</span>
        <img src="../assets/logo-kot-shield-transparent.png" alt="KOT shield">
      </div>
      <div class="cell cyan">
        <span class="tag">On cyan</span>
        <img src="../assets/logo-kot-shield-transparent.png" alt="KOT shield">
      </div>
    </div>
  </div>
</body>
</html>
