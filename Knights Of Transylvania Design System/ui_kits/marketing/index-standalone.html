<link rel="stylesheet" href="marketing.css">
<template id="__bundler_thumbnail" data-bg-color="#ffffff">

    </g>
  </svg>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>
<div id="app"></div>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="Nav-standalone.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="MarqueeStrip.jsx"></script>
<script type="text/babel" src="AboutSection.jsx"></script>
<script type="text/babel" src="GroupsSection.jsx"></script>
<script type="text/babel" src="StaffSection.jsx"></script>
<script type="text/babel" src="ProjectsSection.jsx"></script>
<script type="text/babel" src="EventsSection.jsx"></script>
<script type="text/babel" src="SponsorsSection.jsx"></script>
<script type="text/babel" src="ContactSection.jsx"></script>
<script type="text/babel" src="Footer-standalone.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

function App() {
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });
  const Marquee = window.KOT_Marquee;
  return (
    <>
      <window.KOT_Nav />
      <main data-screen-label="01 Landing">
        <window.KOT_Hero />
        <Marquee
          tone="orange"
          icon="star"
          items={['MOMENTUL TĂU WOOW', 'KNIGHTS OF TRANSYLVANIA', 'KOT', 'CLUJ-NAPOCA', 'CHEERLEADING']}
        />
        <window.KOT_About />
        <window.KOT_Groups />
        <Marquee
          tone="cyan"
          icon="trophy"
          items={['ICU WORLDS 2025', 'TEAM ROMANIA', '20+ TITLURI NAȚIONALE', 'CAMPIONAT NAȚIONAL TURDA 2026']}
        />
        <window.KOT_Staff />
        <window.KOT_Projects />
        <window.KOT_Events />
        <window.KOT_Sponsors />
        <window.KOT_Contact />
      </main>
      <window.KOT_Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
