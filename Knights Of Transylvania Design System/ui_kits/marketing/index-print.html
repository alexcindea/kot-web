<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>KOT — Knights Of Transylvania · Cheerleading (Print)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="marketing.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ============================================================
     Print stylesheet — turns the live marketing site into a
     paged PDF-ready document. Honors the brand colors via
     -webkit-print-color-adjust.
     ============================================================ */
  @page { size: A4; margin: 12mm; }

  html, body {
    background: #ffffff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Hide chrome that doesn't make sense in print */
  .kot-nav,
  .kot-hero__scroll,
  .kot-nav__menu,
  .kot-nav__mobile { display: none !important; }

  /* Kill animations + reveals */
  .kot-reveal { opacity: 1 !important; transform: none !important; }
  .kot-kinetic__letter {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }

  /* Stop infinite marquees from flowing off the page; freeze them */
  .kot-marquee { overflow: hidden !important; padding: 12px 0 !important; }
  .kot-marquee__track {
    animation: none !important;
    transform: none !important;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px !important;
  }
  .kot-marquee__item { font-size: 22px !important; }

  /* Hero: lighter padding, no full viewport */
  .kot-hero {
    min-height: auto !important;
    padding-top: 12mm !important;
    padding-bottom: 24mm !important;
    page-break-after: always;
    break-after: page;
  }
  .kot-hero__shape { display: none !important; }
  .kot-hero__title { font-size: 64px !important; }
  .kot-hero__lede  { font-size: 16px !important; }
  .kot-hero__stats strong { font-size: 36px !important; }

  /* Each major section starts on a new page */
  section.kot-section {
    page-break-before: always;
    break-before: page;
    padding-top: 12mm !important;
    padding-bottom: 12mm !important;
  }
  /* No break before the very first section after the hero — actually, we want it */
  section.kot-section:first-of-type { page-break-before: always; }

  /* Marquee strips shouldn't take a page on their own */
  .kot-marquee {
    page-break-before: auto !important;
    page-break-after: auto !important;
    break-before: auto !important;
    break-after: auto !important;
  }

  /* Avoid cards being split across pages */
  .kot-group-card,
  .kot-staff-card,
  .kot-project,
  .kot-event-card,
  .kot-sponsor-card,
  .kot-milestone {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* Section titles shouldn't dangle from previous section */
  h1, h2, h3, .kot-section__title { page-break-after: avoid; break-after: avoid; }

  /* Keep paragraphs after their headings */
  h1 + p, h2 + p, h3 + p, .kot-section__title + p { page-break-before: avoid; break-before: avoid; }

  /* Footer on its own page */
  .kot-footer {
    page-break-before: always;
    break-before: page;
    padding: 20mm 0 !important;
  }

  /* Hover styles off */
  .kot-btn:hover,
  .kot-group-card:hover,
  .kot-event-card:hover,
  .kot-project:hover { transform: none !important; box-shadow: var(--shadow-md) !important; }

  /* Force background colors to actually print */
  .kot-section--ink,
  .kot-section--orange,
  .kot-marquee,
  .kot-marquee--cyan,
  .kot-marquee--ink,
  .kot-photo,
  .kot-sponsor__logos,
  .kot-footer { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Photo placeholders should keep aspect even in print */
  .kot-photo { min-height: 180px; }

  /* Container can be a touch tighter in print */
  .kot-container { padding-left: 0 !important; padding-right: 0 !important; }

  /* @media print: same rules but wrapped so screen viewing of this file
     also previews the print state. */
  @media screen {
    body { background: #d6d6d6; }
    main, .kot-footer, .kot-hero {
      box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="MarqueeStrip.jsx"></script>
<script type="text/babel" src="AboutSection.jsx"></script>
<script type="text/babel" src="GroupsSection.jsx"></script>
<script type="text/babel" src="StaffSection.jsx"></script>
<script type="text/babel" src="ProjectsSection.jsx"></script>
<script type="text/babel" src="EventsSection.jsx"></script>
<script type="text/babel" src="SponsorsSection.jsx"></script>
<script type="text/babel" src="ContactSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

function App() {
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });
  const Marquee = window.KOT_Marquee;
  return (
    <>
      <main data-screen-label="01 Landing">
        <window.KOT_Hero />
        <Marquee
          tone="orange"
          icon="star"
          items={['MOMENTUL TĂU WOOW', 'KNIGHTS OF TRANSYLVANIA', 'KOT', 'CLUJ-NAPOCA', 'CHEERLEADING']}
        />
        <window.KOT_About />
        <window.KOT_Groups />
        <Marquee
          tone="cyan"
          icon="trophy"
          items={['ICU WORLDS 2025', 'TEAM ROMANIA', '20+ TITLURI NAȚIONALE', 'CAMPIONAT NAȚIONAL TURDA 2026']}
        />
        <window.KOT_Staff />
        <window.KOT_Projects />
        <window.KOT_Events />
        <window.KOT_Sponsors />
        <window.KOT_Contact />
      </main>
      <window.KOT_Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);

// Auto-print once everything is ready
async function readyToPrint() {
  // Wait for fonts
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }
  // Wait for images
  const imgs = Array.from(document.images || []);
  await Promise.all(imgs.map(img => img.complete ? Promise.resolve() :
    new Promise(res => { img.addEventListener('load', res); img.addEventListener('error', res); })));
  // Belt and suspenders
  await new Promise(r => setTimeout(r, 500));
  window.print();
}
window.addEventListener('load', () => { setTimeout(readyToPrint, 800); });
</script>
</body>
</html>
