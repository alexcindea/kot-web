:root {
  /* ---------- Brand ---------- */
  --kot-cyan:        #1bafe2;
  --kot-cyan-600:    #0e9bcb;   /* hover */
  --kot-cyan-700:    #0a7da6;   /* press */
  --kot-cyan-100:    #d4eef8;   /* tint */
  --kot-cyan-50:     #ebf6fb;

  --kot-orange:      #f79335;
  --kot-orange-600:  #e07a1d;
  --kot-orange-700:  #b75f12;
  --kot-orange-100:  #fde2c6;
  --kot-orange-50:   #fff1e2;

  /* ---------- Neutrals ---------- */
  --black:           #0c0c0c;
  --ink:             #14181c;
  --ink-2:           #2a3038;
  --ink-3:           #4a525c;
  --ink-4:           #7a8290;
  --line:            #e3e6ea;
  --line-2:          #ecf0f3;
  --paper:           #f7f8fa;
  --white:           #ffffff;

  /* ---------- Semantic ---------- */
  --success:         #2ea66f;
  --warn:            #e0a012;
  --danger:          #d23f3f;
  --info:            var(--kot-cyan);

  /* ---------- Surfaces (semantic aliases) ---------- */
  --bg:              var(--white);
  --bg-inverted:     var(--black);
  --bg-muted:        var(--paper);
  --fg:              var(--ink);
  --fg-2:            var(--ink-2);
  --fg-3:            var(--ink-3);
  --fg-muted:        var(--ink-4);
  --fg-inverted:     var(--white);
  --border:          var(--line);
  --border-strong:   var(--ink-2);
  --primary:         var(--kot-cyan);
  --primary-fg:      var(--white);
  --accent:          var(--kot-orange);
  --accent-fg:       var(--white);
  --link:            var(--kot-cyan-600);

  /* ---------- Typography ---------- */
  --font-display:    'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif;
  --font-sans:       'Barlow', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:       'JetBrains Mono', 'Fira Code', ui-monospace, monospace;

  /* Type scale (clamps fluid between mobile and desktop). */
  --fs-display-2xl: clamp(64px, 12vw, 160px);   /* hero blockbuster */
  --fs-display-xl:  clamp(48px, 8vw,  112px);   /* section heroes */
  --fs-display-lg:  clamp(40px, 6vw,  80px);    /* section titles */
  --fs-display-md:  clamp(32px, 4vw,  56px);    /* sub-section */
  --fs-display-sm:  clamp(24px, 3vw,  36px);    /* eyebrow display */

  --fs-h1:          clamp(32px, 4vw, 48px);
  --fs-h2:          clamp(24px, 3vw, 36px);
  --fs-h3:          22px;
  --fs-h4:          18px;
  --fs-body:        16px;
  --fs-body-sm:     14px;
  --fs-caption:     12px;
  --fs-eyebrow:     13px;

  --lh-tight:       1.0;
  --lh-snug:        1.12;
  --lh-normal:      1.45;
  --lh-relaxed:     1.6;

  --tracking-display: 0.01em;
  --tracking-eyebrow: 0.18em;
  --tracking-button:  0.06em;
  --tracking-body:    0;

  /* ---------- Spacing (8pt + 4pt substep) ---------- */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  24px;
  --space-6:  32px;
  --space-7:  48px;
  --space-8:  64px;
  --space-9:  96px;
  --space-10: 128px;

  --section-pad-y: clamp(64px, 10vw, 128px);
  --container-pad-x: clamp(20px, 4vw, 48px);
  --container-max:   1280px;

  /* ---------- Radii ---------- */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  /* ---------- Borders ---------- */
  --bw-1: 1px;
  --bw-2: 2px;
  --bw-3: 3px;

  /* ---------- Shadows ---------- */
  --shadow-sm: 0 1px 2px rgba(12,12,12,0.06), 0 1px 3px rgba(12,12,12,0.08);
  --shadow-md: 0 8px 24px -8px rgba(12,12,12,0.18);
  --shadow-lg: 0 24px 60px -12px rgba(12,12,12,0.28);
  --shadow-glow-cyan:   0 0 0 4px rgba(27,175,226,0.18);
  --shadow-glow-orange: 0 0 0 4px rgba(247,147,53,0.22);
  --shadow-inset:       inset 0 1px 0 rgba(255,255,255,0.6);

  /* ---------- Motion ---------- */
  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast:    120ms;
  --dur-base:    200ms;
  --dur-slow:    400ms;
  --dur-page:    600ms;

  /* ---------- Z-index ---------- */
  --z-nav:       50;
  --z-overlay:   80;
  --z-modal:     100;
  --z-toast:     120;
}

/* =====================================================
   Base + semantic element styles
   ===================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--kot-cyan); color: var(--white); }

/* ---------- Display ---------- */
.kot-display-2xl,
.kot-display-xl,
.kot-display-lg,
.kot-display-md,
.kot-display-sm {
  font-family: var(--font-display);
  font-weight: 400; /* Bebas only ships 400 */
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
  color: var(--fg);
  margin: 0;
}
.kot-display-2xl { font-size: var(--fs-display-2xl); }
.kot-display-xl  { font-size: var(--fs-display-xl);  }
.kot-display-lg  { font-size: var(--fs-display-lg);  }
.kot-display-md  { font-size: var(--fs-display-md);  }
.kot-display-sm  { font-size: var(--fs-display-sm);  }

/* ---------- Headings (semantic elements default to display family) ---------- */
h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: var(--tracking-display);
  line-height: var(--lh-snug);
  text-transform: uppercase;
  margin: 0 0 var(--space-4) 0;
  color: var(--fg);
}
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }

h4, h5, h6 {
  font-family: var(--font-sans);
  font-weight: 700;
  line-height: var(--lh-snug);
  margin: 0 0 var(--space-3) 0;
  color: var(--fg);
}
h4 { font-size: var(--fs-h4); }
h5 { font-size: var(--fs-body); text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); }
h6 { font-size: var(--fs-body-sm); text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); color: var(--fg-3); }

/* ---------- Body ---------- */
p {
  margin: 0 0 var(--space-4) 0;
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-relaxed);
  color: var(--fg-2);
  text-wrap: pretty;
}

small, .kot-caption {
  font-size: var(--fs-caption);
  color: var(--fg-3);
}

.kot-eyebrow {
  font-family: var(--font-sans);
  font-size: var(--fs-eyebrow);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  color: var(--kot-orange);
}

/* ---------- Links ---------- */
a {
  color: var(--link);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  transition: color var(--dur-fast) var(--ease-out);
}
a:hover { color: var(--kot-orange); }

/* ---------- Code ---------- */
code, kbd, samp, pre {
  font-family: var(--font-mono);
  font-size: 0.92em;
}
code {
  background: var(--bg-muted);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: var(--radius-xs);
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* ---------- Global container ---------- */
.kot-container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding-left: var(--container-pad-x);
  padding-right: var(--container-pad-x);
  width: 100%;
}

/* ---------- Eyebrow ---------- */
.kot-eyebrow-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.kot-eyebrow-dot { width: 10px; height: 10px; border-radius: 999px; }
.kot-eyebrow-dot.dot-orange { background: var(--kot-orange); box-shadow: 0 0 0 4px rgba(247,147,53,0.18); }
.kot-eyebrow-dot.dot-cyan   { background: var(--kot-cyan);   box-shadow: 0 0 0 4px rgba(27,175,226,0.18); }
.kot-eyebrow-dot.dot-white  { background: white; box-shadow: 0 0 0 4px rgba(255,255,255,0.3); }
.kot-eyebrow-text {
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  color: var(--fg-2);
}

/* ---------- Section ---------- */
.kot-section {
  padding-top: var(--section-pad-y);
  padding-bottom: var(--section-pad-y);
  position: relative;
  overflow: hidden;
}
.kot-section--white  { background: var(--white); color: var(--fg); }
.kot-section--paper  { background: var(--paper); color: var(--fg); }
.kot-section--ink    { background: var(--black); color: var(--white); }
.kot-section--ink .kot-eyebrow-text { color: rgba(255,255,255,0.7); }
.kot-section--orange { background: var(--kot-orange); color: white; }
.kot-section--orange .kot-eyebrow-text { color: rgba(255,255,255,0.85); }
.kot-section__title {
  font-family: var(--font-display);
  font-size: var(--fs-display-lg);
  line-height: 1.05;
  letter-spacing: 0.01em;
  margin: 0 0 48px 0;
  color: inherit;
  max-width: 14ch;
  padding-top: 0.05em;
}
.kot-section__title--inv { color: white; }
.kot-section__sub {
  font-size: 18px;
  line-height: 1.55;
  color: var(--fg-3);
  max-width: 56ch;
  margin: 0 0 32px 0;
}
.kot-section__sub--inv { color: rgba(255,255,255,0.85); }

/* ---------- Buttons ---------- */
.kot-btn {
  --btn-bg: var(--kot-cyan);
  --btn-fg: white;
  --btn-bd: transparent;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: var(--tracking-button);
  font-size: 14px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--btn-bd);
  background: var(--btn-bg);
  color: var(--btn-fg);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none;
  transition: transform var(--dur-base) var(--ease-out),
              background-color var(--dur-base) var(--ease-out),
              box-shadow var(--dur-base) var(--ease-out);
  white-space: nowrap;
}
.kot-btn i { width: 18px; height: 18px; }
.kot-btn--sm { padding: 9px 14px; font-size: 13px; }
.kot-btn--md { padding: 12px 20px; font-size: 14px; }
.kot-btn--lg { padding: 16px 26px; font-size: 15px; }
.kot-btn--primary { --btn-bg: var(--kot-cyan); --btn-fg: white; }
.kot-btn--primary:hover { --btn-bg: var(--kot-cyan-600); transform: translateY(-2px); box-shadow: var(--shadow-glow-cyan); }
.kot-btn--primary:active { transform: scale(0.97); }
.kot-btn--accent { --btn-bg: var(--kot-orange); --btn-fg: white; }
.kot-btn--accent:hover { --btn-bg: var(--kot-orange-600); transform: translateY(-2px); box-shadow: var(--shadow-glow-orange); }
.kot-btn--ghost { --btn-bg: transparent; --btn-fg: var(--fg); --btn-bd: var(--fg); }
.kot-btn--ghost:hover { --btn-bg: var(--fg); --btn-fg: white; }
.kot-btn--dark { --btn-bg: var(--black); --btn-fg: white; }
.kot-btn--dark:hover { --btn-bg: var(--ink); transform: translateY(-2px); }

/* ---------- Pill ---------- */
.kot-pill {
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 11px;
  padding: 5px 11px;
  border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ink); color: white;
}
.kot-pill--cyan   { background: var(--kot-cyan); color: white; }
.kot-pill--orange { background: var(--kot-orange); color: white; }
.kot-pill--cyan.kot-pill--soft   { background: var(--kot-cyan-100); color: var(--kot-cyan-700); }
.kot-pill--orange.kot-pill--soft { background: var(--kot-orange-100); color: var(--kot-orange-700); }

/* ---------- Reveal animation ---------- */
.kot-reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
}
.kot-reveal.is-shown { opacity: 1; transform: none; }

/* ---------- Kinetic letters ---------- */
.kot-kinetic { display: inline-block; }
.kot-kinetic__letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(0.7em);
  animation: kot-kinetic-rise 700ms var(--ease-spring) forwards;
}
@keyframes kot-kinetic-rise {
  0%   { opacity: 0; transform: translateY(0.7em); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0); }
}

/* ---------- Photo placeholder ---------- */
.kot-photo {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--kot-cyan);
  isolation: isolate;
  display: block;
}
.kot-photo--cyan   { background: linear-gradient(135deg, #1bafe2 0%, #0a7da6 60%, #0c0c0c 100%); }
.kot-photo--orange { background: linear-gradient(135deg, #f79335 0%, #b75f12 60%, #0c0c0c 100%); }
.kot-photo--ink    { background: linear-gradient(135deg, #2a3038 0%, #0c0c0c 100%); }
.kot-photo::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.18) 0%, transparent 45%),
    radial-gradient(circle at 75% 75%, rgba(0,0,0,0.25) 0%, transparent 60%);
  pointer-events: none;
}
.kot-photo__inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 16px;
  z-index: 1;
}
.kot-photo__caption {
  position: absolute; bottom: 8px; right: 10px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.03em;
  z-index: 2;
  font-style: italic;
}

/* ============================================================
   Nav
   ============================================================ */
.kot-nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: var(--z-nav);
  height: 72px;
  background: transparent;
  transition: background-color var(--dur-base) var(--ease-out),
              backdrop-filter var(--dur-base) var(--ease-out),
              border-bottom-color var(--dur-base) var(--ease-out);
  border-bottom: 1px solid transparent;
}
.kot-nav.is-scrolled {
  background: rgba(255,255,255,0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom-color: var(--line);
}
.kot-nav__inner {
  max-width: var(--container-max);
  margin: 0 auto;
  height: 100%;
  padding: 0 var(--container-pad-x);
  display: flex;
  align-items: center;
  gap: 24px;
}
.kot-nav__logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
  color: var(--fg);
}
.kot-nav__logo img { height: 42px; width: auto; }
.kot-nav__wordmark {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 0.04em;
  line-height: 1;
  display: flex; flex-direction: column;
}
.kot-nav__wordmark span {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--kot-orange);
  font-family: var(--font-sans);
  font-weight: 700;
}
.kot-nav__links {
  display: flex; gap: 22px;
  margin-left: auto;
}
.kot-nav__links a {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 14px;
  color: var(--fg);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  transition: color var(--dur-fast);
  position: relative;
}
.kot-nav__links a:hover { color: var(--kot-orange); }
.kot-nav__links a::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -6px;
  height: 2px; background: var(--kot-orange);
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--dur-base) var(--ease-out);
}
.kot-nav__links a:hover::after { transform: scaleX(1); }
.kot-nav__cta { display: none; }
@media (min-width: 1100px) { .kot-nav__cta { display: block; } }
.kot-nav__menu {
  display: none;
  background: transparent;
  border: 0;
  cursor: pointer;
  margin-left: auto;
  color: var(--fg);
  width: 44px; height: 44px;
}
@media (max-width: 900px) {
  .kot-nav__links { display: none; }
  .kot-nav__menu { display: inline-flex; align-items: center; justify-content: center; }
}
.kot-nav__mobile {
  background: white;
  border-top: 1px solid var(--line);
  padding: 16px var(--container-pad-x);
  display: flex; flex-direction: column; gap: 8px;
}
.kot-nav__mobile a {
  text-decoration: none;
  font-family: var(--font-sans); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--fg);
  padding: 10px 0;
  border-bottom: 1px solid var(--line-2);
}

/* ============================================================
   Hero
   ============================================================ */
.kot-hero {
  position: relative;
  min-height: 100vh;
  background: var(--white);
  padding-top: 140px;
  padding-bottom: 80px;
  overflow: hidden;
  isolation: isolate;
}
.kot-hero__shapes { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.kot-hero__shape {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.55;
  animation: kot-hero-drift 14s ease-in-out infinite alternate;
}
.kot-hero__shape--cyan {
  width: 540px; height: 540px;
  background: var(--kot-cyan);
  top: -120px; right: -120px;
  opacity: 0.35;
}
.kot-hero__shape--orange {
  width: 460px; height: 460px;
  background: var(--kot-orange);
  bottom: -160px; left: -120px;
  opacity: 0.32;
  animation-delay: -7s;
}
@keyframes kot-hero-drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(40px, -30px) scale(1.08); }
}
.kot-hero__inner { position: relative; z-index: 1; }
.kot-hero__eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 16px;
  font-family: var(--font-sans);
  font-size: 12px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--fg-2);
  box-shadow: var(--shadow-sm);
  margin-bottom: 28px;
  animation: kot-fade-up 600ms var(--ease-out) backwards;
}
.kot-hero__dot {
  width: 8px; height: 8px;
  background: var(--kot-orange);
  border-radius: 999px;
  box-shadow: 0 0 0 4px rgba(247,147,53,0.25);
  animation: kot-pulse 2s ease-in-out infinite;
}
@keyframes kot-pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(247,147,53,0.25); }
  50%      { box-shadow: 0 0 0 10px rgba(247,147,53,0.0); }
}
@keyframes kot-fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

.kot-hero__title {
  font-family: var(--font-display);
  font-size: var(--fs-display-2xl);
  line-height: 0.9;
  letter-spacing: 0.005em;
  margin: 0 0 28px 0;
  color: var(--fg);
}
.kot-hero__rotate {
  display: inline-block;
  color: var(--kot-orange);
  position: relative;
}
.kot-hero__lede {
  font-family: var(--font-sans);
  font-size: clamp(16px, 1.8vw, 21px);
  line-height: 1.55;
  color: var(--fg-2);
  max-width: 56ch;
  margin: 0 0 36px 0;
  animation: kot-fade-up 700ms var(--ease-out) 600ms backwards;
}
.kot-hero__ctas {
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-bottom: 64px;
  animation: kot-fade-up 700ms var(--ease-out) 800ms backwards;
}
.kot-hero__stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  max-width: 720px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
  animation: kot-fade-up 700ms var(--ease-out) 1000ms backwards;
}
.kot-hero__stats div { display: flex; flex-direction: column; gap: 4px; }
.kot-hero__stats strong {
  font-family: var(--font-display);
  font-size: clamp(32px, 4vw, 56px);
  line-height: 1;
  color: var(--fg);
  letter-spacing: 0.02em;
}
.kot-hero__stats span {
  font-family: var(--font-sans);
  font-size: 12px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--fg-3);
}
@media (max-width: 700px) {
  .kot-hero__stats { grid-template-columns: repeat(2, 1fr); }
}
.kot-hero__scroll {
  position: absolute;
  bottom: 32px; right: clamp(20px, 4vw, 48px);
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-sans);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--fg-3);
  z-index: 2;
}
.kot-hero__scroll i { width: 16px; height: 16px; animation: kot-bounce 1.6s ease-in-out infinite; }
@keyframes kot-bounce {
  0%, 100% { transform: rotate(90deg) translateX(0); }
  50%      { transform: rotate(90deg) translateX(6px); }
}

/* ============================================================
   Marquee
   ============================================================ */
.kot-marquee {
  background: var(--kot-orange);
  color: white;
  overflow: hidden;
  padding: 18px 0;
  border-top: 4px solid var(--black);
  border-bottom: 4px solid var(--black);
}
.kot-marquee--cyan { background: var(--kot-cyan); }
.kot-marquee--ink  { background: var(--black); color: white; border-color: var(--kot-orange); }
.kot-marquee__track {
  display: flex; gap: 36px;
  white-space: nowrap;
  animation: kot-marquee 40s linear infinite;
}
.kot-marquee__item {
  display: inline-flex; align-items: center; gap: 18px;
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 44px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
}
.kot-marquee__item i {
  width: 22px; height: 22px;
  fill: currentColor;
}
@keyframes kot-marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-25%); }
}

/* ============================================================
   About
   ============================================================ */
.kot-about__layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  gap: 48px;
  align-items: start;
  margin-top: 16px;
}
@media (max-width: 900px) { .kot-about__layout { grid-template-columns: 1fr; } }
.kot-about__lede {
  font-size: 19px;
  line-height: 1.55;
  color: var(--fg);
  font-weight: 500;
  margin: 0 0 20px 0;
}
.kot-about__body { font-size: 16px; line-height: 1.7; color: var(--fg-3); }
.kot-about__milestones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.kot-milestone .kot-photo { box-shadow: var(--shadow-md); }
.kot-milestone__year {
  font-family: var(--font-display);
  font-size: 44px; line-height: 1;
  color: white;
  letter-spacing: 0.02em;
}
.kot-milestone__label {
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: white;
  font-size: 13px;
  margin-top: 6px;
}

/* ============================================================
   Groups
   ============================================================ */
.kot-groups__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
@media (max-width: 1000px) { .kot-groups__grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px)  { .kot-groups__grid { grid-template-columns: 1fr; } }
.kot-group-card {
  background: white;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.kot-group-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.kot-group-card .kot-photo { border-radius: 0; }
.kot-group-card__age {
  align-self: flex-start;
  background: white;
  color: var(--fg);
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 6px 12px;
  border-radius: 999px;
}
.kot-group-card__body { padding: 18px 20px 20px; }
.kot-group-card__name {
  font-family: var(--font-display);
  font-size: 32px;
  line-height: 1;
  letter-spacing: 0.02em;
  margin: 0 0 4px 0;
  color: var(--fg);
}
.kot-group-card__meta { font-size: 13px; color: var(--fg-3); margin-bottom: 14px; }
.kot-group-card__link {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--kot-cyan-700);
  text-decoration: none;
